  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #11151c;
      color: #edf2f7;
    }
    html, body { margin: 0; padding: 0; overflow: hidden; }
    main { min-height: 100vh; display: grid; place-items: center; }
    section { width: min(32rem, calc(100vw - 3rem)); }
    select, button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.8rem;
      font: inherit;
    }
    button { cursor: pointer; }
    #runner { display: none; width: 100vw; height: 100vh; }
    #runner.active { display: block; }
    #runner header {
      position: fixed;
      z-index: 1;
      padding: 0.6rem 0.8rem;
      background: rgb(17 21 28 / 80%);
    }
    #runner a { color: #9dc8ff; }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      border: none;
      cursor: default !important;
      touch-action: none;
    }
    #loading {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      background: #11151c;
    }
    #loading[hidden] { display: none; }
    #progress { margin-top: 0.5rem; }
    #fullscreen-button {
      position: fixed;
      z-index: 2;
      width: 2rem;
      height: 2rem;
      left: 50%;
      top: 4px;
      transform: translateX(-50%);
      padding: 0;
      margin: 0;
      stroke: #999;
      stroke-width: 10px;
      background: transparent;
      border: 0;
    }
    #fullscreen-button:hover { fill: #999; cursor: pointer; }
    #diagnostics {
      position: fixed;
      z-index: 100;
      inset: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      background: rgb(10 12 17 / 96%);
      color: #edf2f7;
    }
    #diagnostics[hidden] { display: none; }
    #diagnostics.collapsed {
      inset: auto 0 0;
      padding: 0.5rem;
    }
    #diagnostics-toolbar {
      display: flex;
      flex: none;
      gap: 0.5rem;
    }
    #diagnostics-toolbar button {
      width: auto;
      min-width: 0;
      margin: 0;
      padding: 0.65rem;
    }
    #diagnostics-log {
      flex: 1;
      min-height: 0;
      margin: 0.75rem 0 0;
      padding: 0.75rem;
      overflow: auto;
      overscroll-behavior: contain;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #05070a;
      border: 1px solid #3c4657;
      color: #edf2f7;
      font: 0.75rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      user-select: text;
      -webkit-user-select: text;
    }
    #diagnostics.collapsed #diagnostics-log { display: none; }
  </style>
</head>
